# StudyMate Web 化部署：前端静态站 + 后端 + MySQL + nginx 反代
# 用法：
#   docker compose up -d --build
#   docker compose exec backend flask db upgrade   # 首次建表
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      FLASK_APP: "app:create_app"   # 供 `flask db upgrade` 等 CLI 命令使用
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4"
      FLASK_ENV: "production"
      AI_KEY_ENCRYPT: "true"
      CORS_ORIGINS: "https://yourdomain.com"
    volumes:
      - rag_data:/app/data/rag
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./desktop/vue/dist:/usr/share/nginx/html:ro
      - ./nginx/studymate.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # 放 HTTPS 证书
    depends_on:
      - backend

volumes:
  mysql_data:
  rag_data:
